<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>简易EPUB编辑器</title>
<style>
  :root{
    --bg:#1e1e22; --panel:#26262b; --panel2:#2f2f36; --line:#3a3a42;
    --text:#e6e6ea; --muted:#9a9aa6; --accent:#7f77dd; --accent2:#1d9e75;
    --danger:#e24b4a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--text);font-size:13px;
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  /* 顶栏 */
  .topbar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);}
  .topbar .title{flex:1;font-weight:500;}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px;}
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.primary:hover{filter:brightness(1.1);}
  button.toggle.on{background:var(--accent2);border-color:var(--accent2);color:#fff;}
  /* 主体三栏 */
  .main{flex:1;display:flex;min-height:0;}
  .left{width:250px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
  .center{flex:1;display:flex;flex-direction:column;min-width:0;}
  .right{width:270px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px;}
  .pane-head{padding:8px 10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .tree{overflow:auto;flex:1 1 0;min-height:50px;padding:6px;}
  .tree ul{list-style:none;margin:0;padding:0;}
  .tree li{background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin-bottom:6px;padding:6px;}
  .tree li.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .tree .row1{display:flex;align-items:center;gap:6px;}
  .tree .ch-title{flex:1;background:transparent;border:none;color:var(--text);font-size:13px;font-weight:500;padding:2px 0;outline:none;}
  .tree .wc{font-size:11px;color:var(--muted);white-space:nowrap;}
  .tree .ops{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
  .tree .ops button{padding:2px 6px;font-size:11px;white-space:nowrap;}
  .tocprev{font-size:12px;color:var(--muted);padding:4px 10px;line-height:1.7;overflow:auto;flex:1 1 0;min-height:50px;}
  .vsplit{height:7px;flex:0 0 auto;cursor:row-resize;background:var(--line);position:relative;}
  .vsplit:hover{background:var(--accent);}
  .vsplit::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:3px;border-radius:2px;background:var(--muted);opacity:.6;}
  .head-right{display:flex;align-items:center;gap:6px;}
  .pane-head button{padding:2px 9px;font-size:12px;line-height:1.1;}
  .tocprev .t{color:var(--text);}
  .tocprev .n{color:var(--accent);margin-right:6px;}
  .toc-ch-row,.toc-h2-row{display:flex;align-items:center;gap:2px;padding:1px 0;}
  .toc-h2-list{margin-left:12px;}
  .toc-h3-list{margin-left:26px;}
  .tw{cursor:pointer;user-select:none;width:14px;text-align:center;color:var(--muted);flex:0 0 auto;}
  .tw:hover{color:var(--accent);}
  .tc,.th2{cursor:pointer;color:var(--text);flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tc:hover,.th2:hover{color:var(--accent);text-decoration:underline;}
  .toc-h3-row{margin-left:26px;padding:1px 0;color:var(--muted);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .toc-h3-row:hover{color:var(--accent);}
  /* 整行可点（含文字右侧空白）；折叠三角 .tw 仍优先生效 */
  .toc-ch-row,.toc-h2-row,.toc-h3-row{cursor:pointer;}
  .toc-ch-row:hover .tc,.toc-h2-row:hover .th2{color:var(--accent);text-decoration:underline;}
  /* 从目录跳转过来时，高亮一下目标标题 */
  #editor .toc-flash{animation:tocflash 1.8s ease-out 1;}
  @keyframes tocflash{0%{background:rgba(127,119,221,.5);}100%{background:transparent;}}
  /* 工具栏 */
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px;background:var(--panel);border-bottom:1px solid var(--line);}
  .toolbar button{padding:4px 9px;}
  .toolbar select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 6px;font-size:12px;}
  .toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px;}
  /* 用 block 布局 + margin 居中：flex item 会被拉伸到容器高度，内容溢出后背景不再延伸，
     导致第二屏起「文字在深色底上看不见」。block 布局下高度随内容自动增长。 */
  .editor-wrap{flex:1;overflow:auto;padding:24px;display:block;}
  #editor{
    background:#fbfbf7;color:#1a1a1a;width:100%;max-width:720px;min-height:100%;height:auto;
    margin:0 auto;box-sizing:border-box;
    border-radius:10px;padding:42px 56px;line-height:1.9;font-family:"Noto Serif CJK SC","Songti SC",serif;
    font-size:16px;box-shadow:0 2px 18px rgba(0,0,0,.35);outline:none;
  }
  /* 兜底：导入的原文可能自带深色/浅色内联底色或字色，编辑期一律清掉，保证白纸黑字 */
  #editor [style*="background"],#editor [style*="BACKGROUND"]{background:transparent !important;}
  #editor [style*="color:"],#editor [style*="COLOR:"]{color:inherit !important;}
  #editor:focus{box-shadow:0 2px 18px rgba(127,119,221,.4);}
  #editor h1,#editor h2,#editor h3{text-align:center;font-weight:600;line-height:1.6;}
  #editor p{margin:0 0 .9em;}
  #editor img{display:block;margin:1em auto;max-width:90%;height:auto;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.15);}
  /* 阅读模式 */
  #readWrap{display:none;flex:1;overflow:auto;padding:0;}
  #reader{
    margin:18px auto;border-radius:12px;padding:56px 64px;min-height:calc(100% - 36px);
    box-shadow:0 2px 24px rgba(0,0,0,.4);
  }
  #reader h1,#reader h2,#reader h3{text-align:center;font-weight:600;line-height:1.6;margin-top:1.4em;}
  #reader p{margin:0 0 1em;}
  #reader img{display:block;margin:1em auto;max-width:100%;height:auto;border-radius:6px;}
  #reader hr.chsep{border:none;border-top:1px solid rgba(127,127,127,.35);margin:2.4em 0;}
  .readbar{
    position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:6px;
    padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .readbar .grp{display:flex;align-items:center;gap:4px;padding:2px 6px;border:1px solid var(--line);border-radius:8px;}
  .readbar .lbl{font-size:11px;color:var(--muted);margin-right:2px;}
  .readbar button{padding:3px 9px;font-size:12px;}
  .readbar button.on{border-color:var(--accent);color:var(--accent);}
  .readbar .rd-val{font-size:12px;min-width:42px;text-align:center;color:var(--text);}
  /* 右侧 */
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;}
  .field input,.field select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;}
  .field select{appearance:none;}
  .stats{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;}
  .stats .big{font-size:20px;font-weight:500;color:var(--accent);}
  .stats .lbl{font-size:11px;color:var(--muted);}
  .stats .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .chlist{font-size:12px;}
  .chlist div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line);}
  .chlist .n{color:var(--muted);}
  .coverbox{font-size:11px;color:var(--muted);}
  .coverbox img{max-width:100%;border-radius:6px;margin-top:4px;}
  /* 底栏 */
  .statusbar{height:28px;display:flex;align-items:center;gap:18px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);font-size:11px;color:var(--muted);}
  .statusbar b{color:var(--text);font-weight:500;}
  .hint{color:var(--muted);font-size:11px;padding:6px 10px;line-height:1.6;}
</style>
</head>
<body>
  <div class="topbar">
    <span class="title">简易EPUB编辑器</span>
    <button id="readToggle" class="toggle">阅读模式</button>
    <button id="newBtn" title="清空当前内容，新建空白书（草稿先自动备份，可找回）">新建文件</button>
    <button id="impBtn">导入文件</button>
    <input id="importFile" type="file" accept=".txt,.md,.markdown,.doc,.docx,.epub,text/plain,text/markdown,application/epub+zip" style="display:none"/>
    <button id="export" class="primary">导出 EPUB</button>
  </div>

  <div class="main">
    <!-- 左栏：章节树 + 目录预览 -->
    <div class="left" id="leftPanel">
      <div class="pane-head"><span>章节 / 目录</span><span class="head-right"><span id="chCount" class="wc">0 章</span><button id="addCh" title="新增章节">＋</button></span></div>
      <div class="tree" id="treePane"><ul id="tree"></ul></div>
      <div class="vsplit" id="vsplit" title="拖动调整上下面板比例"></div>
      <div class="pane-head"><span>目录预览（导出效果）</span></div>
      <div class="tocprev" id="tocPrev"></div>
    </div>

    <!-- 中栏：编辑 / 阅读 切换 -->
    <div class="center">
      <!-- 编辑态 -->
      <div class="toolbar" id="toolbar">
        <button data-cmd="bold" title="加粗"><b>B</b></button>
        <button data-cmd="italic" title="斜体"><i>I</i></button>
        <button data-cmd="underline" title="下划线"><u>U</u></button>
        <span class="sep"></span>
        <button data-cmd="formatBlock" data-val="H1" title="标题1">H1</button>
        <button data-cmd="formatBlock" data-val="H2" title="标题2">H2</button>
        <button data-cmd="formatBlock" data-val="H3" title="标题3">H3</button>
        <button data-cmd="formatBlock" data-val="P" title="正文">¶</button>
        <span class="sep"></span>
        <button data-cmd="insertUnorderedList" title="无序列表">• 列表</button>
        <button data-cmd="insertOrderedList" title="有序列表">1. 列表</button>
        <button data-cmd="formatBlock" data-val="BLOCKQUOTE" title="引用">引用</button>
        <span class="sep"></span>
        <button data-cmd="justifyLeft" title="居左">居左</button>
        <button data-cmd="justifyCenter" title="居中">居中</button>
        <button data-cmd="justifyRight" title="居右">居右</button>
        <button id="btnIndent" title="首行缩进 2 字符（再次点击取消）">首行缩进</button>
        <span class="sep"></span>
        <button id="btnImg" title="插入图片">🖼 图片</button>
        <input id="imgInput" type="file" accept="image/*" multiple style="display:none"/>
      </div>
      <div class="editor-wrap" id="editorWrap">
        <div id="bigWarn" style="display:none;flex:0 0 auto;margin:8px 12px 0;padding:8px 10px;border-radius:6px;background:#5a3a12;color:#ffd9a0;font-size:12px;line-height:1.6;"></div>
        <div id="editor" contenteditable="true" spellcheck="false"></div>
      </div>

      <!-- 阅读态 -->
      <div id="readWrap">
        <div class="readbar">
          <div class="grp">
            <span class="lbl">字号</span>
            <button id="rdFontMinus">−</button>
            <span class="rd-val" id="rdFontVal">18px</span>
            <button id="rdFontPlus">＋</button>
          </div>
          <div class="grp">
            <span class="lbl">行距</span>
            <select id="rdLine">
              <option value="1.5">1.5</option>
              <option value="1.8">1.8</option>
              <option value="1.9" selected>1.9</option>
              <option value="2.1">2.1</option>
              <option value="2.4">2.4</option>
            </select>
          </div>
          <div class="grp">
            <span class="lbl">对齐</span>
            <button class="rd-align" data-align="justify">两端</button>
            <button class="rd-align" data-align="left">左</button>
            <button class="rd-align" data-align="center">居中</button>
          </div>
          <div class="grp">
            <span class="lbl">主题</span>
            <button class="rd-theme" data-theme="day">日间</button>
            <button class="rd-theme" data-theme="eye">护眼</button>
            <button class="rd-theme" data-theme="night">夜间</button>
            <button class="rd-theme" data-theme="paper">羊皮纸</button>
          </div>
          <div class="grp">
            <span class="lbl">版心</span>
            <button class="rd-width" data-width="narrow">窄</button>
            <button class="rd-width" data-width="medium">中</button>
            <button class="rd-width" data-width="wide">宽</button>
          </div>
          <div class="grp">
            <span class="lbl">字体</span>
            <button class="rd-font" data-font="serif">宋</button>
            <button class="rd-font" data-font="sans">黑</button>
          </div>
          <span class="sep"></span>
          <button id="rdApply" title="把当前阅读设置存为本书默认">应用为默认</button>
          <button id="rdExit">退出阅读</button>
        </div>
        <div id="reader"></div>
      </div>
    </div>

    <!-- 右栏：元数据 + 统计 -->
    <div class="right">
      <div class="field"><label>书名</label><input id="mTitle" placeholder="书名"/></div>
      <div class="field"><label>作者</label><input id="mAuthor" placeholder="作者名"/></div>
      <div class="field"><label>语言代码</label><input id="mLang" placeholder="zh" value="zh"/></div>
      <div class="field"><label>出版年份</label><input id="mDate" placeholder="2026"/></div>
      <div class="field"><label>封面图片</label>
        <input id="mCover" type="file" accept="image/*"/>
        <div class="coverbox" id="coverBox"></div>
      </div>

      <div class="field"><label>默认行距（读者可覆盖）</label>
        <select id="sLine">
          <option value="1.5">1.5</option>
          <option value="1.8" selected>1.8</option>
          <option value="2.0">2.0</option>
          <option value="2.2">2.2</option>
        </select>
      </div>
      <div class="field"><label>默认对齐（读者可覆盖）</label>
        <select id="sAlign">
          <option value="justify" selected>两端对齐</option>
          <option value="left">左对齐</option>
          <option value="center">居中</option>
        </select>
      </div>

      <div class="field"><label>自动分章粒度</label>
        <select id="sSplit">
          <option value="0" selected>不拆分（整章保留原样）</option>
          <option value="3000">3000 字 / 章</option>
          <option value="5000">5000 字 / 章</option>
          <option value="10000">10000 字 / 章</option>
        </select>
        <div class="hint" style="padding:4px 0 0;">只对超过该字数的章节生效；文档自带的一级标题永远是章节边界。改完点下方按钮可立即重新分章。</div>
      </div>
      <div class="field">
        <div style="display:flex;align-items:center;gap:8px;">
          <label for="chkTocSplit" style="white-space:nowrap;color:var(--text);font-size:13px;cursor:pointer;">二级标题分章</label>
          <input type="checkbox" id="chkTocSplit" style="width:auto;flex:0 0 auto;"/>
        </div>
      </div>
      <div class="field">
        <button id="btnResplit" style="width:100%;padding:6px 8px;">按此重新分章</button>
      </div>

      <div class="stats">
        <div class="row"><div><div class="lbl">总字数</div><div class="big" id="stTotal">0</div></div>
          <div style="text-align:right;"><div class="lbl">图片</div><div class="big" id="stImg" style="color:var(--accent2);">0</div></div></div>
        <div class="lbl" style="margin-top:8px;">当前章节字数</div>
        <div class="big" id="stCur" style="color:var(--accent2);">0</div>
      </div>

      <div class="lbl" style="margin:6px 0;">各章字数</div>
      <div class="chlist" id="chList"></div>
      <div class="hint">所有 XML / OPF / 打包均在后台自动完成，你只需编辑文字。字号与排版默认交给读者，可进「阅读模式」预览并调整。</div>
    </div>
  </div>

  <div class="statusbar">
    <span>当前：<b id="stChTitle">—</b></span>
    <span>本章：<b id="stChWc">0</b> 字</span>
    <span>总计：<b id="stAllWc">0</b> 字</span>
    <span>图片：<b id="stImgBar">0</b> 张</span>
  </div>

<script src="jszip.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const editor = $('editor');

let book = null;
let currentId = null;
let readingMode = false;
const tocState = {ch:new Set(), h2:new Set()};
const LS_KEY = 'epub_editor_v1';
const LS_IMG = 'epub_editor_images_v1';
const RS_KEY = 'epub_reader_v1';
const READER_STEPS = [12,13,14,15,16,17,18,19,20,22,24,26,28,30,34,38,42];
let imgUrlCache = {};   // name -> blob URL（仅用于编辑器内显示，不入存储）
let imgSeq = 0;

function uid(){ return 'c'+Math.random().toString(36).slice(2,9); }
function uuid(){ return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;const v=c==='x'?r:(r&0x3|0x8);return v.toString(16);}); }
function escapeXml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;'); }
/* 轻量文本计数：去空白后按 Unicode 码点计数，避免展开成数组 */
function textLen(s){
  let n=0; const str=String(s==null?'':s);
  for(let i=0;i<str.length;i++){
    const c=str.charCodeAt(i);
    if(c===0x20||c===0x09||c===0x0A||c===0x0D||c===0x0B||c===0x0C||c===0xFEFF) continue;
    if(c>=0xD800 && c<=0xDBFF) continue; // 代理对高位，与低位合计一个码点
    n++;
  }
  return n;
}
/* 统计 HTML 字数：走纯字符串（去标签→去实体→去空白），不建 DOM，比 DOM 解析快一个数量级 */
function countWords(html){
  let s=String(html||'');
  if(!s) return 0;
  s=s.replace(/<(script|style)[\s\S]*?<\/\1\s*>/gi,'');
  s=s.replace(/<[^>]*>/g,'');
  s=s.replace(/&nbsp;/gi,' ');                                          // 不断行空格＝空白，不计
  s=s.replace(/&[a-zA-Z][a-zA-Z0-9]*;|&#\d+;|&#x[0-9a-fA-F]+;/g,'x');   // 其余实体各计 1 字（如 &amp;）
  s=s.replace(/\s/g,'');
  return textLen(s);
}
function countImages(){
  let n=0;
  (book.chapters||[]).forEach(c=>{ const m=(c.html||'').match(/data-img=/g); if(m) n+=m.length; });
  return n;
}
function b64ToBlob(b64, mime){
  try{
    const bin=atob(b64); const len=bin.length; const arr=new Uint8Array(len);
    for(let i=0;i<len;i++) arr[i]=bin.charCodeAt(i);
    return new Blob([arr], {type:mime||'image/png'});
  }catch(e){ return new Blob([], {type:mime||'image/png'}); }
}
function genImgName(){ imgSeq++; return 'img'+Date.now().toString(36)+'_'+imgSeq; }
function mimeOfExt(ext){ return ({png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',bmp:'image/bmp'})[ext]||'image/png'; }
function newChapter(title){ return {id:uid(), title:title||'新章节', html:'<p><br/></p>', wordCount:0}; }

/* ---------- 章节规范化：补 id + 自动拆分超长章节 ---------- */
/* 单章过大时，contenteditable 要承载几万个 DOM 节点，浏览器必然卡死。
   导入后按阈值在“标题/段落”边界自动切成多章，保证每章都在可流畅编辑的规模。 */
const AUTO_SPLIT_CHARS = 5000;   // 默认自动拆章字数阈值（可在右栏调整）
const AUTO_SPLIT_DEFAULT = 5000;
const HUGE_CHAPTER     = 6000;   // 超过此值在编辑器顶部给出提示

/* 把一段 HTML 按顶层块级节点切成若干片，每片累计字数不超过 limit */
function splitHtmlBySize(html, limit){
  const tmp=document.createElement('div'); tmp.innerHTML=html||'';
  const parts=[]; let buf=[], n=0;
  const flush=()=>{ if(buf.length){ parts.push(buf.join('')); } buf=[]; n=0; };
  const nl=TAGS_SPLIT_AFTER;
  [...tmp.childNodes].forEach(node=>{
    if(node.nodeType!==1){
      const t=(node.textContent||'').trim();
      if(t){ buf.push('<p>'+escapeHtml(t)+'</p>'); n+=textLen(t); }
      return;
    }
    const tag=node.tagName;
    const wt=textLen(node.textContent||'');
    // 遇到 H1/H2/H3 边界且已积累足够内容时先切一刀，让每章保持完整语义
    if(nl.indexOf(tag)>=0 && n>0 && n>=limit*0.5) flush();
    buf.push(node.outerHTML); n+=wt;
    if(n>=limit) flush();
  });
  flush();
  return parts;
}
const TAGS_SPLIT_AFTER = ['H1','H2','H3'];

function autoSplitChapter(ch, limit){
  const html=ch.html||'';
  const w=countWords(html);
  const base=(ch.title||'').trim()||'未命名章节';
  const from=ch._from||ch.id;     // 追溯原始章来源，便于之后按新阈值重新分章
  if(w<=limit) return [ch];
  const parts=splitHtmlBySize(html, limit);
  if(parts.length<=1) return [ch];
  return parts.map((p,i)=>({id:uid(), title:(i===0?base:(base+' · 第'+(i+1)+'节')), html:p||'<p><br/></p>', wordCount:0, _from:from, _auto:true}));
}
/* 当前生效的自动分章阈值（0 = 不拆分） */
function getSplitAt(){
  const el=$('sSplit');
  if(el){ const v=parseInt(el.value,10); return isNaN(v)?AUTO_SPLIT_DEFAULT:v; }
  return AUTO_SPLIT_DEFAULT;
}
function finalizeChapters(list, opts){
  const doSplit = !opts || opts.split!==false;
  const limit = (opts && typeof opts.splitAt==='number') ? opts.splitAt : getSplitAt();
  let arr=(list||[]).map(c=> c && c.id ? c : Object.assign({}, c, {id:uid()}));
  if(doSplit && limit>0){
    const out=[];
    arr.forEach(c=>{ autoSplitChapter(c, limit).forEach(x=>out.push(x)); });
    arr=out;
  }
  arr.forEach(c=>{ if(!c.id) c.id=uid(); if(typeof c.wordCount!=='number') c.wordCount=0; });
  return arr;
}
/* 按当前粒度重新整理全部章节：先按来源还原被拆开的内容，再用新阈值重拆 */
function resplitAll(){
  if(!book.chapters.length){ alert('当前没有任何章节。'); return; }
  commitEditor();
  const limit=getSplitAt();
  const seen=new Map(); const groups=[];
  book.chapters.forEach(c=>{
    const key=c._from||c.id;
    if(!seen.has(key)){ seen.set(key, groups.length); groups.push({key:key, title:c.title, html:''}); }
    const g=groups[seen.get(key)];
    g.html += (c.html||'');
  });
  const out=[];
  groups.forEach(g=>{
    const src={id:g.key, title:g.title, html:g.html, wordCount:0};
    if(limit>0) autoSplitChapter(src, limit).forEach(x=>out.push(x));
    else out.push(src);
  });
  const before=book.chapters.length;
  book.chapters=out;
  refreshCounts(); renderAll(); save();
  selectChapter(book.chapters[0].id);
  alert('已按'+(limit>0?(limit+' 字/章'):'「不拆分」')+'重新分章：'+before+' 章 → '+out.length+' 章。');
}

/* ---------- 阅读设置 ---------- */
function loadRS(){
  try{ const s=localStorage.getItem(RS_KEY); if(s) return Object.assign(defaultRS(), JSON.parse(s)); }catch(e){}
  return defaultRS();
}
function defaultRS(){ return {fontSize:18, lineHeight:1.9, align:'justify', theme:'day', width:'medium', font:'serif'}; }
let RS = loadRS();
function saveRS(){ try{ localStorage.setItem(RS_KEY, JSON.stringify(RS)); }catch(e){} }

/* ---------- 初始化 ---------- */
let saveTimer=null;
function save(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(doSave, 800);
}
let quotaWarned=false;
function quotaWarn(){
  if(quotaWarned) return; quotaWarned=true;
  alert('浏览器本地存储已满，本次改动无法自动保存草稿。\n请尽快点「导出 EPUB」保存成文件，以免内容丢失。');
}
function doSave(){
  saveTimer=null;
  try{
    commitEditor();
    const { _images, ...rest } = book;
    try{ localStorage.setItem(LS_KEY, JSON.stringify(rest)); }
    catch(le){ quotaWarn(); return; }
    try{ localStorage.setItem(LS_IMG, JSON.stringify(_images||{})); }catch(e){}
  }catch(e){}
}
function load(){
  try{
    const s=localStorage.getItem(LS_KEY);
    if(s){
      book=JSON.parse(s);
      try{ book._images=JSON.parse(localStorage.getItem(LS_IMG)||'{}'); }catch(e){ book._images={}; }
      if(!book._images) book._images={};
      return true;
    }
  }catch(e){}
  return false;
}

/* ---------- 渲染 ---------- */
function totalWords(){ return book.chapters.reduce((a,c)=>a+(c.wordCount||0),0); }

function renderTree(){
  const ul=$('tree'); ul.innerHTML='';

        <button data-act="merge" ${i===book.chapters.length-1?'disabled':''} title="把下一章合并进本章（标题不变）">并</button>
        <button data-act="mergedeg" ${i===book.chapters.length-1?'disabled':''} title="把下一章合并进本章，下一章标题降级为二级标题">降</button>
        <button data-act="split" title="把本章内的二级标题拆成独立章节">升</button>
        <button data-act="autosplit" title="把过长的本章按段落自动拆成多章">分</button>
        <button data-act="del" title="删除本章">删</button>
      </div>`;
    ul.appendChild(li);

  $('chCount').textContent = book.chapters.length + ' 章';
}

function chapterHeadingTree(html){
  const tmp=document.createElement('div'); tmp.innerHTML=html||'';
  const nodes=[...tmp.querySelectorAll('h1,h2,h3')];
  const out=[]; let curH2=null;
  nodes.forEach(n=>{
    const lvl=parseInt(n.tagName[1]); if(lvl<2) return;
    const text=(n.textContent||'').trim()||'(无标题)';
    if(lvl===2){ curH2={level:2,text,children:[]}; out.push(curH2); }
    else if(curH2){ curH2.children.push(text); }
    else { out.push({level:3,text,children:[]}); }
  });
  return out;
}
function chapterHeadingList(html, chapNum){
  const tmp=document.createElement('div'); tmp.innerHTML=html||'';
  const nodes=[...tmp.querySelectorAll('h1,h2,h3')];
  const out=[];
  nodes.forEach(n=>{
    const lvl=parseInt(n.tagName[1]); if(lvl<2) return;
    const text=(n.textContent||'').trim()||'(无标题)';
    out.push({level:lvl, text, id:'h'+chapNum+'-'+(out.length+1)});
  });
  return out;
}
/* 标题树缓存：避免每次切章/重渲染都把全部章节重新解析一遍 */
const headingCache=new Map();
function headingTreeOf(ch){
  const key=ch.id||('_idx_'+book.chapters.indexOf(ch));
  const sig=(ch.html?ch.html.length:0)+'|'+(ch.wordCount||0);
  const hit=headingCache.get(key);
  if(hit && hit.sig===sig) return hit.tree;
  const tree=chapterHeadingTree(ch.html);
  headingCache.set(key,{sig: sig, tree: tree});
  return tree;
}
function renderToc(){
  const box=$('tocPrev');
  /* 全量重建会丢滚动位置：点第 30 章后目录弹回顶部，看着像"跳转乱跳" */
  const keepScroll=box.scrollTop;
  if(!book.chapters.length){ box.innerHTML='<span class="t">（暂无章节）</span>'; return; }
  let html='';
  book.chapters.forEach((ch,i)=>{
    const heads=headingTreeOf(ch);
    const collapsed=tocState.ch.has(ch.id);
    /* fi = 该标题在本章 h2/h3 扁平序列中的序号，跳转后靠它精确定位到正文里的对应标题 */
    let fi=0;
    html+=`<div class="toc-ch-row" data-goto="${ch.id}"><span class="tw" data-toggle="ch" data-id="${ch.id}">${collapsed?'▸':'▾'}</span><span class="tc">${i+1}. ${escapeXml(ch.title)}</span></div>`;
    if(!collapsed){
      if(heads.length){
        html+='<div class="toc-h2-list">';
        heads.forEach((h,hi)=>{
          if(h.level===3){
            const f3=fi++;
            html+=`<div class="toc-h3-row" data-goto="${ch.id}" data-fi="${f3}">${escapeXml(h.text)}</div>`;
            return;
          }
          const f2=fi++;
          const key=ch.id+'::'+hi;
          const c2=tocState.h2.has(key);
          html+=`<div class="toc-h2-row" data-goto="${ch.id}" data-fi="${f2}"><span class="tw" data-toggle="h2" data-id="${ch.id}" data-hi="${hi}">${c2?'▸':'▾'}</span><span class="th2">${escapeXml(h.text)}</span></div>`;
          if(!c2 && h.children.length){
            html+='<div class="toc-h3-list">'+h.children.map(c=>{
              const fc=fi++;
              return `<div class="toc-h3-row" data-goto="${ch.id}" data-fi="${fc}">${escapeXml(c)}</div>`;
            }).join('')+'</div>';
          }
        });
        html+='</div>';
      } else {
        html+='<div class="toc-h2-list"><div class="toc-h3-row" style="color:var(--muted);cursor:default;">（本章无二级/三级标题）</div></div>';
      }
    }
  });
  box.innerHTML=html;
  box.scrollTop=keepScroll;
}

function renderStats(){
  const imgN=countImages();
  $('stTotal').textContent = totalWords();
  $('stAllWc').textContent = totalWords();
  $('stImg').textContent = imgN;
  $('stImgBar').textContent = imgN;
  const cur=book.chapters.find(c=>c.id===currentId);

  $('stCur').textContent=cw; $('stChWc').textContent=cw;
  $('stChTitle').textContent=cur?cur.title:'—';
  $('chList').innerHTML = book.chapters.map((c,i)=>`<div><span>${i+1}. ${escapeXml(c.title)}</span><span class="n">${(c.wordCount||0)}字</span></div>`).join('');
}

function renderMeta(){
  $('mTitle').value=book.meta.title||'';
  $('mAuthor').value=book.meta.author||'';
  $('mLang').value=book.meta.language||'zh';
  $('mDate').value=book.meta.date||'';

  cb.innerHTML = book.meta.cover? `<img src="data:image/${cext};base64,${book.meta.cover.data}"/>` : '（未设置）';

function renderAll(){ renderTree(); renderToc(); renderStats(); renderMeta(); }

/* ---------- 章节操作 ---------- */
function mergeNext(idx, degrade){
  if(idx>=book.chapters.length-1) return;
  const cur=book.chapters[idx], nxt=book.chapters[idx+1];
  let nxtHtml=nxt.html||'';
  if(degrade) nxtHtml='<h2>'+escapeXml(nxt.title)+'</h2>'+nxtHtml;
  cur.html=(cur.html||'')+nxtHtml;
  book.chapters.splice(idx+1,1);
  refreshCounts();
  if(currentId===cur.id){ editor.innerHTML=renderChapterForEdit(cur.html); }
  else if(currentId===nxt.id){ currentId=cur.id; editor.innerHTML=renderChapterForEdit(cur.html); }
  renderAll(); save();
}
function splitH2ToChapters(idx){
  const ch=book.chapters[idx]; if(!ch) return;
  const tmp=document.createElement('div'); tmp.innerHTML=ch.html||'';
  const nodes=[...tmp.childNodes];
  const segs=[]; let cur={title:ch.title, html:[]};
  for(const node of nodes){
    if(node.nodeType===1 && node.tagName==='H2'){
      segs.push(cur);
      cur={title:(node.textContent||'').trim()||'未命名章节', html:[]};
    } else if(node.nodeType===1){
      cur.html.push(node.outerHTML);
    }
  }
  segs.push(cur);
  let starts=segs;
  if(starts.length>1 && starts[0].html.join('').trim()==='') starts=starts.slice(1);
  if(!starts.length) starts=[{title:ch.title, html:['<p><br/></p>']}];
  const newChapters=starts.map(s=>({id:uid(), title:s.title, html:s.html.join('')||'<p><br/></p>'}));
  book.chapters.splice(idx,1,...newChapters);
  refreshCounts();
  /* 不要提前把 currentId 指向新章节，否则 selectChapter 会把编辑器残留内容写进新章节首章。
     让 selectChapter 先把编辑器内容提交回被拆掉的旧章节（已移除→安全跳过），再切换到首章。 */
  renderAll(); save();
  if(newChapters[0]) selectChapter(newChapters[0].id);
}
function autoSplitCurrent(idx){
  const ch=book.chapters[idx]; if(!ch) return;
  const limit=getSplitAt();
  if(!(limit>0)){ alert('当前设置是「不拆分」。请先在右侧「自动分章粒度」里选一个字数，再点「分」。'); return; }
  const w=countWords(ch.html);
  const pieces=autoSplitChapter(ch, limit);
  if(pieces.length<=1){ alert('本章共 '+w+' 字，篇幅适中，无需拆分。'); return; }
  if(!confirm('本章 '+w+' 字，将按段落自动拆分为 '+pieces.length+' 章。继续？')) return;
  commitEditor();
  book.chapters.splice(idx,1,...pieces);
  refreshCounts(); renderAll(); save();
  selectChapter(pieces[0].id);
}
function commitEditor(){
  if(currentId===null) return;
  const cur=book.chapters.find(c=>c.id===currentId);
  if(!cur) return;
  /* 跳转高亮是纯视觉临时态，不能写进正文数据 */
  editor.querySelectorAll('.toc-flash').forEach(el=>el.classList.remove('toc-flash'));
  const tmp=document.createElement('div'); tmp.innerHTML=editor.innerHTML;
  tmp.querySelectorAll('img').forEach(img=>{
    const name=img.getAttribute('data-img');
    const src=img.getAttribute('src')||'';
    if(name && book._images[name]){
      /* 本编辑器插入的占位图：清掉临时 blob:/data: src，只留 data-img 占位，
         导出处再统一还原成 images/ 真实路径（避免把临时地址写进书里/存进草稿） */
      img.removeAttribute('src');
    } else if(/^data:image\//i.test(src)){
      /* 粘贴进来的裸 data: 图：入库并转占位 */
      const n=genImgName();
      const mm=src.match(/^data:image\/(\w+);base64,(.*)$/);
      const ext=(mm&&mm[1])||'png';
      book._images[n]={b64:mm[2], ext:ext==='jpeg'?'jpg':ext, mime:'image/'+(ext==='jpg'?'jpeg':ext)};
      img.setAttribute('data-img', n);
      img.removeAttribute('src');
    } else {
      /* 外链 / 相对路径图片（如 Markdown ![alt](url)）：保留原 src，只去掉无效 blob: 临时地址；
         无效 / 孤立的 data-img 占位一并清掉，避免导出出坏图 */
      if(/^blob:/i.test(src)) img.removeAttribute('src');
      if(name && !book._images[name]) img.removeAttribute('data-img');
    }
  });
  cur.html=tmp.innerHTML;
  cur.wordCount=countWords(cur.html);
}
function renderChapterForEdit(html){
  const tmp=document.createElement('div'); tmp.innerHTML=html||'';
  tmp.querySelectorAll('img[data-img]').forEach(img=>{
    const name=img.getAttribute('data-img');
    const rec=book._images[name];
    if(rec){
      let url=imgUrlCache[name];
      if(!url){ url=URL.createObjectURL(b64ToBlob(rec.b64, rec.mime||mimeOfExt(rec.ext))); imgUrlCache[name]=url; }
      img.setAttribute('src', url);
    } else {
      img.removeAttribute('src');
    }
  });
  return tmp.innerHTML;
}
function selectChapter(id, fi){
  commitEditor();
  currentId=id;
  const ch=book.chapters.find(c=>c.id===id);
  editor.innerHTML = ch?renderChapterForEdit(ch.html):'';
  warnBigChapter(ch);
  renderAll();
  /* 切章必须把编辑区滚回顶部，否则会停在上一次的滚动位置，看起来像"跳错了地方" */
  const wrap=$('editorWrap');
  if(wrap) wrap.scrollTop=0;
  syncTreeActive();
  if(typeof fi==='number' && fi>=0) revealHeading(fi);
}
/* 单章过大时给出可见提示，并告知如何拆分（contenteditable 承载能力有上限） */
function warnBigChapter(ch){
  const box=$('bigWarn'); if(!box) return;
  const w=ch?countWords(ch.html):0;
  if(w>HUGE_CHAPTER){
    box.style.display='block';
    box.innerHTML='本章约 '+w+' 字，内容过大，编辑时可能明显卡顿。建议点左侧该章的「分」按钮，按段落自动拆成多章（或用「升」按二级标题拆分）。';
  } else {
    box.style.display='none'; box.innerHTML='';
  }
}

function refreshCounts(){
  book.chapters.forEach(c=>{ c.wordCount=countWords(c.html); });
}

/* 输入时的统计：走节流，且用原生 textContent 取文本，
   避免 editor.innerHTML 全量序列化后又解析一遍（大章节下这是主要卡顿源） */
let statTimer=null;
function updateLiveStats(){
  const cw=textLen(editor.textContent||'');
  const cur=book.chapters.find(c=>c.id===currentId);
  if(cur){
    cur.wordCount=cw;
    const li=document.querySelector('#tree li[data-id="'+currentId+'"] .wc');
    if(li) li.textContent=cw+'字';
  }
  const total=book.chapters.reduce((a,c)=>a+(c.id===currentId?cw:(c.wordCount||0)),0);
  $('stCur').textContent=cw; $('stChWc').textContent=cw;
  $('stAllWc').textContent=total; $('stTotal').textContent=total;
}
function onEdit(){
  if(statTimer) return;
  statTimer=setTimeout(()=>{ statTimer=null; try{ updateLiveStats(); }catch(e){} }, 250);
  save();
}

/* 事件委托：章节树 */
$('tree').addEventListener('click', e=>{
  const li=e.target.closest('li'); if(!li) return;
  /* 点标题输入框时，不切换章节、不重渲染章节树：否则 input 会被重建导致无法聚焦编辑 */
  if(e.target.classList && e.target.classList.contains('ch-title')) return;
  const id=li.dataset.id;
  const act=e.target.dataset.act;
  if(readingMode){ toggleReading(); }
  if(act){
    e.stopPropagation();
    const idx=book.chapters.findIndex(c=>c.id===id);
    if(act==='up' && idx>0){ [book.chapters[idx-1],book.chapters[idx]]=[book.chapters[idx],book.chapters[idx-1]]; }
    if(act==='down' && idx<book.chapters.length-1){ [book.chapters[idx+1],book.chapters[idx]]=[book.chapters[idx],book.chapters[idx+1]]; }
    if(act==='merge' && idx<book.chapters.length-1){ mergeNext(idx,false); return; }
    if(act==='mergedeg' && idx<book.chapters.length-1){ mergeNext(idx,true); return; }
    if(act==='split'){ splitH2ToChapters(idx); return; }
    if(act==='autosplit'){ autoSplitCurrent(idx); return; }
    if(act==='del'){
      const wasViewing=(currentId===id);
      book.chapters.splice(idx,1);
      /* 断开绑定：被删章一旦被移除，其编辑器残留内容绝不能写进切换后的新章 */
      if(wasViewing){ currentId=null; }
      refreshCounts(); renderAll(); save();
      if(book.chapters[0]) selectChapter(book.chapters[0].id);
      return;
    }
    refreshCounts(); renderAll(); save();
    if(currentId){ commitEditor(); selectChapter(currentId); }
    return;
  }
  commitEditor(); selectChapter(id);
});
/* 章节标题：像书名那样随输随改（input 事件实时同步，不重建输入框，不掉焦点） */
$('tree').addEventListener('input', e=>{
  if(e.target.classList.contains('ch-title')){
    const li=e.target.closest('li'); const ch=book.chapters.find(c=>c.id===li.dataset.id);
    if(ch){ ch.title=e.target.value; renderToc(); renderStats(); save(); }
  }
});

/* 目录预览：折叠 + 跳转编辑 */
$('tocPrev').addEventListener('click', e=>{
  const tw=e.target.closest('.tw');
  if(tw){
    const id=tw.dataset.id, hi=tw.dataset.hi, type=tw.dataset.toggle;
    if(type==='ch'){ tocState.ch.has(id)?tocState.ch.delete(id):tocState.ch.add(id); }
    else { const key=id+'::'+hi; tocState.h2.has(key)?tocState.h2.delete(key):tocState.h2.add(key); }
    renderToc(); return;
  }
  const row=e.target.closest('[data-goto]');
  if(!row) return;
  /* data-fi 存在 → 这是一条二级/三级标题，要跳到章内对应位置而不是章首 */
  const fi=(row.dataset.fi!==undefined && row.dataset.fi!=='')?parseInt(row.dataset.fi,10):-1;
  if(readingMode) toggleReading();
  selectChapter(row.dataset.goto, fi>=0?fi:null);
});

/* 把编辑区滚到章内第 fi 个 h2/h3（与目录里的扁平序号一一对应）并高亮 */
function revealHeading(fi){
  requestAnimationFrame(()=>{
    const wrap=$('editorWrap'); if(!wrap) return;
    const hs=[...editor.querySelectorAll('h2,h3')];
    const el=hs[fi]; if(!el) return;
    const top=el.getBoundingClientRect().top - wrap.getBoundingClientRect().top + wrap.scrollTop - 24;
    try{ wrap.scrollTo({top:Math.max(0,top), behavior:'smooth'}); }
    catch(e){ wrap.scrollTop=Math.max(0,top); }
    el.classList.add('toc-flash');
    setTimeout(()=>el.classList.remove('toc-flash'),1900);
  });
}

function syncTreeActive(){

  if(!li || !li.parentElement) return;
  const pr=pane.getBoundingClientRect(), lr=li.getBoundingClientRect();

}

/* 对选中范围内的块级元素应用样式（居左/居中/居右/首行缩进）。
   注意：Chrome 的 contenteditable 默认把每段正文包成 <div>（而非 <p>），所以选择器必须包含 div，
   否则「正文」的居中/居左/居右/首行缩进点了完全不生效（二级标题是 h2 所以没事）。 */
function applyToBlocksInSelection(prop, value){
  editor.focus();
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount) return;
  const range=sel.getRangeAt(0);
  let blocks=[...editor.querySelectorAll('p,h1,h2,h3,blockquote,li,div')].filter(b=>range.intersectsNode(b));
  /* 只保留最内层的块：避免把祖先 div 一起加上样式（嵌套时会整段误居中） */
  blocks=blocks.filter(b=>!blocks.some(o=>o!==b && b.contains(o)));
  if(!blocks.length && sel.anchorNode){
    let n=sel.anchorNode; if(n.nodeType===3) n=n.parentNode;
    const b=n.closest && n.closest('p,h1,h2,h3,blockquote,li,div');
    if(b) blocks=[b];
  }
  blocks.forEach(b=>{
    if(prop==='textIndent'){
      b.style.textIndent = (value==='2em' && b.style.textIndent==='2em') ? '' : value;
    } else {
      b.style[prop]=value;
    }
  });
  if(blocks.length) onEdit();
}

/* ---------- 导入 Markdown（.md → 章节 + 合规 XHTML） ---------- */
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function mdInline(s){
  s=escapeHtml(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,'$1<em>$2</em>');
  s=s.replace(/(^|[^_])_([^_]+)_/g,'$1<em>$2</em>');
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img alt="$1" src="$2"/>');
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2">$1</a>');
  return s;
}
function mdToHtml(md){
  const lines=md.replace(/\r\n/g,'\n').split('\n');
  const codes=[];
  let inCode=false, codeBuf=[];
  const processed=[];
  for(const line of lines){
    if(/^```/.test(line)){
      if(!inCode){ inCode=true; codeBuf=[]; }
      else { codes.push(codeBuf.join('\n')); processed.push('CODE'+(codes.length-1)); inCode=false; }
      continue;
    }
    if(inCode){ codeBuf.push(line); continue; }
    processed.push(line);
  }
  if(inCode) codes.push(codeBuf.join('\n'));
  const out=[];
  let i=0;
  const isSpecial=(s)=>/^(#{1,6})\s/.test(s) || /^>\s?/.test(s) || /^\s*[-*+]\s+/.test(s) || /^\s*\d+\.\s+/.test(s) || /^```/.test(s) || /^(-{3,}|\*{3,}|_{3,})\s*$/.test(s) || /^CODE\d+$/.test(s);
  while(i<processed.length){
    const line=processed[i];
    const cm=line.match(/^CODE(\d+)$/);
    if(cm){ out.push('<pre><code>'+escapeHtml(codes[parseInt(cm[1])])+'</code></pre>'); i++; continue; }
    const hm=line.match(/^(#{1,6})\s+(.+)$/);
    if(hm){ out.push('<h'+hm[1].length+'>'+mdInline(hm[2].trim())+'</h'+hm[1].length+'>'); i++; continue; }
    if(/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){ out.push('<hr/>'); i++; continue; }
    if(/^>\s?/.test(line)){
      const buf=[];
      while(i<processed.length && /^>\s?/.test(processed[i])){ buf.push(mdInline(processed[i].replace(/^>\s?/,''))); i++; }
      out.push('<blockquote>'+buf.join('<br/>')+'</blockquote>');
      continue;
    }
    if(/^\s*[-*+]\s+/.test(line)){
      const items=[];
      while(i<processed.length && /^\s*[-*+]\s+/.test(processed[i])){ items.push('<li>'+mdInline(processed[i].replace(/^\s*[-*+]\s+/,''))+'</li>'); i++; }
      out.push('<ul>'+items.join('')+'</ul>');
      continue;
    }
    if(/^\s*\d+\.\s+/.test(line)){
      const items=[];
      while(i<processed.length && /^\s*\d+\.\s+/.test(processed[i])){ items.push('<li>'+mdInline(processed[i].replace(/^\s*\d+\.\s+/,''))+'</li>'); i++; }
      out.push('<ol>'+items.join('')+'</ol>');
      continue;
    }
    if(!line.trim()){ i++; continue; }
    const buf=[];
    while(i<processed.length && processed[i].trim() && !isSpecial(processed[i])){ buf.push(mdInline(processed[i])); i++; }
    out.push('<p>'+buf.join('<br/>')+'</p>');
  }
  return out.join('');
}
function mdSplitChapters(md){
  const lines=md.replace(/\r\n/g,'\n').split('\n');
  const chapters=[];
  let cur={title:null, body:[]};
  const push=()=>{ if(cur.title||cur.body.join('').trim()) chapters.push({title:cur.title||'未命名章节', html:mdToHtml(cur.body.join('\n'))}); };
  for(const line of lines){
    const m=line.match(/^#\s+(.+?)\s*$/);
    if(m){ push(); cur={title:m[1], body:[]}; }
    else cur.body.push(line);
  }
  push();
  return chapters;
}

function importTxt(text, filename){
  if(!confirm('导入纯文本将替换当前所有内容，确定继续？（草稿会先自动备份到浏览器本地）')) return;

         韵文逐句居中、散文整段左对齐、批注单独成段，避免导入/导出变成一整段 */
      paras=reformatQianlvBlob(body);

    }

    currentId=null;

    alert('已导入 '+book.chapters.length+' 个章节（纯文本按空行分段'+(book.chapters.length>1?'，过长内容已自动拆分':'')+'）。');
  }catch(err){ alert('文本导入失败：'+(err&&err.message?err.message:err)); }
}

/* ---------- 导入 EPUB（反向读回编辑） ---------- */
function resolvePath(base, rel){
  const baseParts=base.split('/'); baseParts.pop();
  const parts=baseParts.concat((rel||'').split('/'));
  const stack=[];
  parts.forEach(p=>{ if(p==='.'){} else if(p==='..'){ stack.pop(); } else if(p!==''){ stack.push(p); } });
  return stack.join('/');
}
function mediaTypeFromName(name){
  const ext=(name.split('.').pop()||'').toLowerCase();
  return ({png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',bmp:'image/bmp',svg:'image/svg+xml'})[ext]||'image/png';
}
async function readChapter(zip, chapPath, opfDir, imgStore){
  const file=zip.file(chapPath); if(!file) return {title:'', html:''};
  let xhtml=await file.async('string');
  const doc=new DOMParser().parseFromString(xhtml,'text/html');
  const body=doc.body||doc.documentElement;
  if(!body) return {title:'', html:''};
  const chapDir=chapPath.split('/'); chapDir.pop();
  const imgs=[...body.querySelectorAll('img')];
  for(const img of imgs){
    const src=img.getAttribute('src')||''; if(!src) continue;
    if(/^data:/i.test(src)) continue; // 已是内联，原样保留
    const ip=resolvePath(chapPath, src);
    const f=zip.file(ip);
    if(f){
      const b64=await f.async('base64');
      const ext=(ip.split('.').pop()||'png').toLowerCase();
      const name='img'+(Object.keys(imgStore).length+1);
      imgStore[name]={b64, ext:ext==='jpg'?'jpg':ext, mime:mediaTypeFromName(ip)};
      img.setAttribute('data-img', name); img.removeAttribute('src');
    }
    else { img.removeAttribute('src'); }
  }
  body.querySelectorAll('*').forEach(el=>{
    [...el.attributes].forEach(a=>{ if(a.name==='epub:type'||a.name==='xml:lang'||a.name.startsWith('xmlns')) el.removeAttribute(a.name); });
  });
  let title='';
  const h=body.querySelector('h1')||body.querySelector('h2');
  if(h){ title=h.textContent.trim(); h.remove(); }
  if(!title){ title=chapPath.split('/').pop().replace(/\.x?html$/i,''); }
  return {title, html:body.innerHTML};
}
async function importEpub(file){
  if(!confirm('导入将替换当前所有内容，确定继续？（草稿会先自动备份到浏览器本地）')) return;
  try{
    const buf=await file.arrayBuffer();
    const zip=await JSZip.loadAsync(buf);
    const containerFile=zip.file('META-INF/container.xml');
    if(!containerFile) throw new Error('不是有效的 EPUB（缺少 container.xml）');
    const container=new DOMParser().parseFromString(await containerFile.async('string'),'text/html');
    const rf=container.querySelector('rootfile');
    if(!rf) throw new Error('无法定位 OPF 包文档');
    const opfPath=rf.getAttribute('full-path'); if(!opfPath) throw new Error('OPF 路径为空');
    const opfDoc=new DOMParser().parseFromString(await zip.file(opfPath).async('string'),'text/html');
    const opfDir=opfPath.split('/'); opfDir.pop();
    const items=[...opfDoc.querySelectorAll('item')];
    const byId={};
    items.forEach(it=>{ byId[it.getAttribute('id')]={href:it.getAttribute('href'),mediaType:it.getAttribute('media-type'),props:(it.getAttribute('properties')||'')}; });
    const refs=[...opfDoc.querySelectorAll('itemref')].map(r=>r.getAttribute('idref'));
    const coverMeta=opfDoc.querySelector('meta[name="cover"]');
    let coverId=coverMeta?coverMeta.getAttribute('content'):null;
    if(!coverId){ const ci=items.find(it=>/cover-image/.test(it.getAttribute('properties')||'')); if(ci) coverId=ci.getAttribute('id'); }

    const meta={title:'', author:'', language:'zh', date:'', cover:null, style:{lineHeight:1.8,align:'justify'}};
    const t=opfDoc.getElementsByTagName('dc:title')[0]; if(t) meta.title=t.textContent.trim();
    const a=opfDoc.getElementsByTagName('dc:creator')[0]; if(a) meta.author=a.textContent.trim();
    const l=opfDoc.getElementsByTagName('dc:language')[0]; if(l) meta.language=l.textContent.trim()||'zh';
    const d=opfDoc.getElementsByTagName('dc:date')[0]; if(d) meta.date=d.textContent.trim();

    if(coverId && byId[coverId]){
      const cp=resolvePath(opfPath, byId[coverId].href);
      const cf=zip.file(cp);
      if(cf){ const b64=await cf.async('base64'); const ext=(cp.split('.').pop()||'jpg').toLowerCase(); meta.cover={name:'cover.'+ext, data:b64, ext:(ext==='jpg'?'jpeg':ext)}; }
    }

    const imgStore={};
    const chapters=[];
    for(const ref of refs){
      const it=byId[ref]; if(!it) continue;
      if(it.props.indexOf('nav')>=0) continue;
      if((it.href||'').toLowerCase().endsWith('toc.ncx')) continue;
      if(!/xhtml?$/i.test(it.mediaType||'') && !/xhtml?$/i.test(it.href||'')) continue;
      const cpath=resolvePath(opfPath, it.href);
      const ch=await readChapter(zip, cpath, opfDir, imgStore);
      chapters.push({id:uid(), title:ch.title||('第 '+(chapters.length+1)+' 章'), html:ch.html||'<p><br/></p>', wordCount:0});
    }
    if(!chapters.length) throw new Error('未在 EPUB 中找到可编辑的正文章节');

    currentId=null; // 导入前断开编辑器绑定，避免旧编辑器内容覆盖新章节
    const finalChapters=finalizeChapters(chapters);
    finalChapters.forEach(c=>{ c.html=healEntities(c.html||''); });
    book={meta, chapters:finalChapters, _images:imgStore};
    currentId=null;
    refreshCounts(); selectChapter(book.chapters[0].id); save();
    alert('导入成功：'+book.chapters.length+' 章，'+totalWords()+' 字，'+countImages()+' 张图。\n可继续编辑，或点「导出 EPUB」重新导出。');
  }catch(err){
    console.error(err);
    alert('导入失败：'+(err&&err.message?err.message:err));
  }
}

/* ---------- 新建空白文件 ---------- */
function newFile(){
  const text = book.chapters.map(c=>(c.html||'').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').trim()).join('');
  const metaFilled = (book.meta.title||'')+(book.meta.author||'')+(book.meta.date||'');
  const hasImg = book._images && Object.keys(book._images).length>0;
  const hasContent = text.length>0 || metaFilled.trim().length>0 || hasImg;
  if(hasContent && !confirm('新建文件将清空当前所有章节与书名信息。\n当前草稿会先自动备份到浏览器本地（保留最近 5 份，可找回），确定新建空白书？')) return;
  if(!hasContent && !confirm('确定新建一个空白文件？')) return;
  /* 备份当前草稿（保留最近 5 份，键名 epub_editor_backup_v1_<时间戳>），误删可找回 */
  try{
    commitEditor();
    const { _images, ...rest } = book;
    const snap = { book: rest, images: _images||{}, ts: Date.now() };
    let idx=[];
    try{ idx=JSON.parse(localStorage.getItem('epub_editor_backups')||'[]'); }catch(e){ idx=[]; }
    const key='epub_editor_backup_v1_'+Date.now();
    idx.unshift({ ts:Date.now(), key });
    idx=idx.slice(0,5);
    localStorage.setItem(key, JSON.stringify(snap));
    localStorage.setItem('epub_editor_backups', JSON.stringify(idx));
  }catch(e){ /* 备份失败不阻断新建 */ }
  /* 重置为空白书 */
  book={ meta:{title:'', author:'', language:'zh', date:'', cover:null, style:{lineHeight:1.8, align:'justify'}}, chapters:[ newChapter('第 1 章') ], _images:{} };
  currentId=book.chapters[0].id;
  refreshCounts(); renderAll(); selectChapter(currentId); save();
}

/* ---------- EPUB 生成（全后台） ---------- */
/* 修复「实体被二次转义」：粘贴/导入的正文里若本来就带 &nbsp;，编辑器会把 & 再转义成 &amp;，
   阅读器里就原样显示成 "&nbsp;"（还会层层叠加成 &amp;nbsp;）。这里把多层 &amp;nbsp; 逐层还原并统一成空格。 */
function healEntities(html){
  let s=String(html==null?'':html);
  /* 逐层还原被多次转义的常见实体：&amp;nbsp; → &nbsp; → 空格 */
  const ENT='nbsp|#160|#xa0|ensp|emsp|thinsp|amp|lt|gt|quot|apos|mdash|ndash|hellip|ldquo|rdquo|lsquo|rsquo|middot|bull|times|divide|deg|plusmn|laquo|raquo|copy|reg|trade';
  const re=new RegExp('&amp;('+ENT+');','gi');
  for(let i=0;i<8;i++){
    const before=s;
    s=s.replace(re,'&$1;');
    if(s===before) break;
  }
  s=s.replace(/&nbsp;|&#160;|&#xa0;/gi,' ');
  return s;
}
/* 把常见「命名实体」转成真正的 Unicode 字符；amp/lt/gt/quot/apos 保留为实体（XML 安全转义）。 */
const NAMED_ENT={nbsp:' ',ensp:'\u2002',emsp:'\u2003',thinsp:'\u2009',mdash:'\u2014',ndash:'\u2013',hellip:'\u2026',ldquo:'\u201C',rdquo:'\u201D',lsquo:'\u2018',rsquo:'\u2019',middot:'\u00B7',bull:'\u2022',times:'\u00D7',divide:'\u00F7',deg:'\u00B0',plusmn:'\u00B1',laquo:'\u00AB',raquo:'\u00BB',copy:'\u00A9',reg:'\u00AE',trade:'\u2122'};
function decodeNamedEntities(s){
  return String(s).replace(/&([a-zA-Z][a-zA-Z0-9]*);/g,(m,n)=>{
    const k=n.toLowerCase();
    return Object.prototype.hasOwnProperty.call(NAMED_ENT,k)?NAMED_ENT[k]:m;
  });
}
function cleanXhtml(html){
  return decodeNamedEntities(healEntities(html))
    .replace(/<br\s*\/?>/gi,'<br/>')
    .replace(/<hr\s*\/?>/gi,'<hr/>')
    .replace(/<img([^>]*?)\s*\/?>/gi,'<img$1/>')
    .replace(/&nbsp;/g,' ')
    .replace(/&(?!(amp|lt|gt|quot|apos|#\d+|#x[0-9a-fA-F]+);)/g,'&amp;');
}
/* 把「被压成一团的历年诗稿」（整段文本、靠 ◇ 日期 ◇ 分隔、内部含 &amp;nbsp;）重构成标准结构：
   日期行单独成段；韵文按 。！？ 逐句居中；散文（含长句）整段左对齐；· · ·批 注 单独成段。
   仅当检测到「长文本 + 多个 ◇ 日期 标记」时才生效，正常章节原样返回。 */
function reformatQianlvBlob(html){
  let text=String(html==null?'':html).replace(/<[^>]+>/g,'');
  text=healEntities(text); // 先把 &amp;nbsp; 等实体还原成空格，否则 ◇ 与日期之间的 &amp;nbsp; 会挡住下面的标记匹配
  const dateRe=/◇\s*\d{4}\s*年\s*\d{1,2}\s*月\s*\d{1,2}\s*日/g;
  const markers=(text.match(dateRe)||[]).length;
  if(text.length<300 || markers<2) return html; // 不是团状结构，原样返回
  const s=text;
  const SEP=/◇\s*(\d{4}\s*年\s*\d{1,2}\s*月\s*\d{1,2}\s*日)\s*◇/;
  const parts=s.split(SEP);
  const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const splitLines=t=>t.split(/(?<=。|！|？)/).map(x=>x.trim()).filter(Boolean);
  const isProse=lines=>lines.some(l=>l.length>26);
  let out=[];
  for(let i=1;i<parts.length;i+=2){
    const date=parts[i].trim();
    let body=parts[i+1]||'';
    const m=body.match(/·\s*·\s*·\s*批\s*注\s*[:：]/);
    let anno='';
    if(m){ anno=body.slice(m.index).trim(); body=body.slice(0,m.index); }
    out.push('<p>◇ '+date+' ◇</p>');
    const lines=splitLines(body);
    if(isProse(lines)){ out.push('<p>'+esc(body.trim())+'</p>'); }
    else { lines.forEach(l=>out.push('<p style="text-align: center;">'+esc(l)+'</p>')); }
    if(anno){ out.push('<p>· · ·</p>'); out.push('<p>'+esc(anno.replace(/^·\s*·\s*·\s*/,'').trim())+'</p>'); }
    out.push('<p><br/></p>');
  }
  return out.join('');
}
/* 非破坏式 HTML→XHTML 序列化：浏览器宽松解析后再规整，保留所有标签、style（对齐）与换行 */
function serializeXhtml(node){
  const VOID={br:1,hr:1,img:1,input:1,meta:1,link:1,area:1,base:1,col:1,embed:1,param:1,source:1,track:1,wbr:1};
  let out='';
  node.childNodes.forEach(n=>{
    if(n.nodeType===3){ out+=escapeXml(n.nodeValue); }
    else if(n.nodeType===1){
      const tag=n.tagName.toLowerCase();
      let attrs='';
      for(let i=0;i<n.attributes.length;i++){
        const a=n.attributes[i];
        if(a.name==='data-img') continue; // 已在导出前转为 src
        attrs+=' '+a.name+'="'+escapeXml(a.value)+'"';
      }
      if(VOID[tag]){ out+='<'+tag+attrs+'/>'; }
      else { out+='<'+tag+attrs+'>'+serializeXhtml(n)+'</'+tag+'>'; }
    } /* 注释等其它节点忽略 */
  });
  return out;
}
function lenientToXhtml(html){
  const tmp=document.createElement('div');
  tmp.innerHTML=html||'';
  return serializeXhtml(tmp);
}
function collectImages(){
  const map=new Map(); const files=[];
  book.chapters.forEach(ch=>{
    const html=ch.html||'';
    let m; const re=/data-img="([^"]+)"/gi;
    while((m=re.exec(html))){
      const name=m[1];
      if(book._images[name] && !map.has(name)){
        const rec=book._images[name];
        map.set(name, 'images/'+name+'.'+rec.ext);
        files.push({name:name+'.'+rec.ext, base64:rec.b64, ext:rec.ext});
      }
    }
  });
  return {map,files};
}
function mediaType(ext){ return ({png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',bmp:'image/bmp'})[ext]||'image/png'; }

function getTocSplit(){ const el=$('chkTocSplit'); return el? el.checked : true; }
/* 把章节切成「导出文件（section）」列表。
   split=true：每个 h2/h3 二级/三级标题切成独立 XHTML 文件（年份章→每首诗一个文件）。
     这样「按文件建目录」的阅读器（微信读书等）也能让每个二级标题成为可点章节、跳转生效。
   split=false：整章保留为一个文件，h2/h3 通过 toc.ncx 的锚点（#id）跳转（标准阅读器可用）。 */
function buildSections(){
  const split=getTocSplit();
  const out=[]; const ctr={v:0};
  const href=()=>'chap'+(++ctr.v)+'.xhtml';
  if(!split){
    book.chapters.forEach((ch,i)=>{
      out.push({ href:href(), title:ch.title||('第'+(i+1)+'章'), chapter:i, body:ch.html||'<p><br/></p>', level:1, single:true, isHead:false });
    });
    return out;
  }
  book.chapters.forEach((ch,ci)=>{
    const chapterTitle=ch.title||('第'+(ci+1)+'章');
    const tmp=document.createElement('div'); tmp.innerHTML=(ch.html||'<p><br/></p>');
    const nodes=[...tmp.childNodes];
    const headIdx=[];
    nodes.forEach((n,idx)=>{ if(n.nodeType===1 && (n.tagName==='H2'||n.tagName==='H3')) headIdx.push(idx); });
    if(headIdx.length===0){
      out.push({ href:href(), title:chapterTitle, chapter:ci, body:ch.html||'<p><br/></p>', level:1, single:true, isHead:false });
      return;
    }
    /* 第一个二级标题之前的内容（序言 / 引言 / 章名 h1）单独成文件作为「章首页」。
       始终生成章首页：① 微信读书按文件建目录，章首页让「年份 / 分卷」成为可点独立页；
       ② 若引言已自带 <h1> 章名则不重复前置，避免章名显示两遍（早期缺陷）。 */
    const introNodes=nodes.slice(0, headIdx[0]);
    const introHtml=introNodes.map(n=> n.nodeType===1? n.outerHTML : escapeHtml(n.textContent)).join('');
    const firstIntro=introNodes[0];
    const introStartsWithH1 = !!(firstIntro && firstIntro.nodeType===1 && firstIntro.tagName==='H1');
    const headBody = (introStartsWithH1 ? '' : '<h1>'+escapeXml(chapterTitle)+'</h1>') + introHtml;
    out.push({ href:href(), title:chapterTitle, chapter:ci, body:headBody, level:1, single:false, isHead:true });
    /* 每个二级/三级标题（含其下方直到下一个标题的内容）各成一个文件 */
    let lastH2=null;
    for(let h=0; h<headIdx.length; h++){
      const start=headIdx[h];
      const end=(h+1<headIdx.length)?headIdx[h+1]:nodes.length;
      const segNodes=nodes.slice(start,end);
      const segHtml=segNodes.map(n=> n.nodeType===1? n.outerHTML : escapeHtml(n.textContent)).join('');
      const el=nodes[start];
      const lvl=(el.tagName==='H2')?2:3;
      const t=(el.textContent||'').trim()||'(无标题)';
      const sec={ href:href(), title:t, chapter:ci, body:segHtml, level:lvl, single:false, isHead:false };
      if(lvl===2){ sec.parent=null; lastH2=sec.href; } else { sec.parent=lastH2; }
      out.push(sec);
    }
  });
  return out;
}
function buildSectionXhtml(section, imgMap){
  const lang=book.meta.language||'zh';
  const title=escapeXml(section.title||'');
  let html=section.body||'<p><br/></p>';
  /* 去掉跳转高亮等临时视觉标记，避免导出到书里 */
  html=html.replace(/class="([^"]*)"/gi,(m,c)=>{
    const rest=c.split(/\s+/).filter(t=>t && t!=='toc-flash').join(' ');
    return rest?`class="${rest}"`:'';
  });
  /* 图片：把 data-img 占位解析成打包进书的真实路径。
     只保留一个 src，并清掉编辑器显示用的 blob:/data: 临时 src，
     否则同一 <img> 出现两个 src 属性会让 XHTML 解析失败（早期「带图章节整章被剥光」根因）。
     外链/相对路径图片（如 Markdown ![alt](url)）保留原 src，仅去掉无效 blob: 临时地址。 */
  html=html.replace(/<img\b([^>]*)>/gi,(m,attrs)=>{
    let a=attrs.replace(/\s*\/?\s*$/,'').trim();
    const dm=a.match(/data-img="([^"]*)"/i);
    const name=dm?dm[1]:null;
    if(name && book._images[name]){
      a=a.replace(/\s+src="[^"]*"/gi,'').replace(/\s+data-img="[^"]*"/gi,'').trim();
      const src='images/'+name+'.'+book._images[name].ext;
      return `<img${a?(' '+a):''} src="${src}"/>`;
    }
    a=a.replace(/\s+data-img="[^"]*"/gi,'').replace(/\s+src="blob:[^"]*"/gi,'').trim();
    return `<img${a?(' '+a):''}/>`;
  });
  /* 团状诗稿重构：仅当「整段文本、无二级/三级标题、无图片」时生效，避免误伤已结构化的章节或带图章节 */
  if(!/<img\b/i.test(html) && !/<h2|<h3/i.test(html) && /^\s*<p>[\s\S]*<\/p>\s*$/.test(html)){
    const reform=reformatQianlvBlob(html);
    if(reform && reform!==html) html=reform;
  }
  /* 给 h2/h3 加锚点 id（标准阅读器内的子标题跳转；拆分模式下每条已是独立文件，id 不影响跳转但无害）。
     注意：真实书源里 h2/h3 可能已自带 id（如 id="h3-1"），先清掉旧 id 再注入，避免产生重复 id 属性（不规范且某些校验器会报错）。 */
  const heads=chapterHeadingList(html, (section.chapter||0)+1);
  let k=0;
  html = html.replace(/<(h2|h3)\b([^>]*)>/gi, (m,tag,attrs)=>{
    const id=(heads[k]&&heads[k].id)||('h'+((section.chapter||0)+1)+'-'+(k+1));
    k++;
    const cleanAttrs=attrs.replace(/\s+id="[^"]*"/i,'');
    return `<${tag} id="${id}"${cleanAttrs}>`;
  });
  /* 实体还原 + 自闭合 + 转义（cleanXhtml），再经浏览器 DOM 重新序列化（lenientToXhtml），
     保证产出合法 XHTML 且完整保留标签 / style 对齐 / 换行 / 图片——不再依赖易碎的 XML 严格解析与保底分支。 */
  const raw=cleanXhtml(html);
  let body=lenientToXhtml(raw);
  if(!body || !body.trim()) body=raw;
  const xml=`<?xml version="1.0" encoding="utf-8"?>\n`+
    `<html xmlns="http://www.w3.org/1999/xhtml" lang="${lang}" xml:lang="${lang}">\n`+
    `<head><meta charset="utf-8"/><title>${title}</title><link rel="stylesheet" href="style.css"/></head>\n`+
    `<body>${body}</body></html>`;
  return xml;
}

function buildNav(sections){

function buildNcx(sections){
  /* 单文件模式：章 + 章内 h2/h3 锚点（标准阅读器可跳转；微信读书不支持锚点故无效）。
     拆分模式：每个二级/三级标题独立文件，content 直接指向该文件——微信读书等「按文件建目录」

  let play=0, depth=1;
  const byCh=new Map();
  sections.forEach(s=>{ if(!byCh.has(s.chapter)) byCh.set(s.chapter,[]); byCh.get(s.chapter).push(s); });
  let navMap='';
  book.chapters.forEach((ch,ci)=>{
    const secs=byCh.get(ci)||[];
    if(!secs.length) return;
    const chTitle=ch.title||('第'+(ci+1)+'章');
    if(secs.length===1 && secs[0].single){
      const file=secs[0].href;
      const cId='np'+(++play);
      navMap+=`<navPoint id="${cId}" playOrder="${play}"><navLabel><text>${escapeXml(chTitle)}</text></navLabel><content src="${file}"/>`;
      const heads=chapterHeadingList(ch.html, ci+1);
      let pendingH2=null, h2Children='';
      const closeH2=()=>{ if(pendingH2){ navMap+=`<navPoint id="${pendingH2.id}" playOrder="${pendingH2.play}"><navLabel><text>${escapeXml(pendingH2.text)}</text></navLabel><content src="${file}#${pendingH2.hid}"/>`+h2Children+'</navPoint>'; h2Children=''; } };
      heads.forEach(h=>{
        if(h.level>=3){ const id='np'+(++play); depth=Math.max(depth,3); h2Children+=`<navPoint id="${id}" playOrder="${play}"><navLabel><text>${escapeXml(h.text)}</text></navLabel><content src="${file}#${h.id}"/></navPoint>`; }
        else { closeH2(); pendingH2={ id:'np'+(++play), play:play, text:h.text, hid:h.id }; h2Children=''; }
      });
      closeH2();
      navMap+='</navPoint>';
    } else {
      const first=secs[0];
      const cId='np'+(++play);
      navMap+=`<navPoint id="${cId}" playOrder="${play}"><navLabel><text>${escapeXml(chTitle)}</text></navLabel><content src="${first.href}"/>`;
      const subs=(first.isHead)?secs.slice(1):secs.slice(0);
      const h2s=subs.filter(s=>s.level===2);
      h2s.forEach(h2=>{
        const id='np'+(++play); depth=Math.max(depth,2);
        navMap+=`<navPoint id="${id}" playOrder="${play}"><navLabel><text>${escapeXml(h2.title)}</text></navLabel><content src="${h2.href}"/>`;
        const kids=subs.filter(s=>s.level===3 && s.parent===h2.href);
        kids.forEach(k=>{ const kid='np'+(++play); depth=Math.max(depth,3); navMap+=`<navPoint id="${kid}" playOrder="${play}"><navLabel><text>${escapeXml(k.title)}</text></navLabel><content src="${k.href}"/></navPoint>`; });
        navMap+='</navPoint>';
      });
      subs.filter(s=>s.level===3 && !s.parent).forEach(o=>{ const id='np'+(++play); depth=Math.max(depth,3); navMap+=`<navPoint id="${id}" playOrder="${play}"><navLabel><text>${escapeXml(o.title)}</text></navLabel><content src="${o.href}"/></navPoint>`; });
      navMap+='</navPoint>';
    }
  });
  return `<?xml version="1.0" encoding="utf-8"?>
<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">
<head><meta name="dtb:uid" content="urn:uuid:${uuid()}"/><meta name="dtb:depth" content="${depth}"/></head>
<docTitle><text>${escapeXml(book.meta.title||'未命名')}</text></docTitle>
<navMap>${navMap}</navMap></ncx>`;
}
const CONTAINER=`<?xml version="1.0" encoding="utf-8"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
<rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles>
</container>`;

function download(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}

/* ---------- 导入 DOCX（.docx → 章节 + 合规 XHTML） ---------- */
async function docxToChapters(buf){
  try{
    const zip=await JSZip.loadAsync(buf);
    const docFile=zip.file('word/document.xml');
    if(!docFile) throw new Error('不是有效的 DOCX（缺少 word/document.xml）');
    const docXml=await docFile.async('string');
    const relsFile=zip.file('word/_rels/document.xml.rels');
    const relsXml=relsFile? await relsFile.async('string'):'';
    const relsDoc=new DOMParser().parseFromString(relsXml||'<r/>','text/xml');
    const relMap={};
    [...relsDoc.getElementsByTagName('Relationship')].forEach(r=>{ relMap[r.getAttribute('Id')]=r.getAttribute('Target'); });
    const doc=new DOMParser().parseFromString(docXml,'text/xml');
    const body=(doc.getElementsByTagName('w:body')[0])||doc.documentElement;
    const imgByRid={};
    const images={};
    async function imgFor(rid){
      if(imgByRid[rid]) return imgByRid[rid];
      const target=relMap[rid]; if(!target) return null;
      const path=('word/'+target).replace(/\/(\.\/)+/g,'/');
      const f=zip.file(path); if(!f) return null;
      const b64=await f.async('base64'); const mt=mediaTypeFromName(target);
      const ext=(mt.split('/')[1]||'png').replace('jpeg','jpg');
      const name='img'+(Object.keys(images).length+1);
      images[name]={b64, ext, mime:mt};
      imgByRid[rid]=name; return name;
    }
    const ps=[...body.getElementsByTagName('w:p')];
    const parsed=[];
    for(const p of ps){
      const pPr=p.getElementsByTagName('w:pPr')[0];
      let level=0, isList=false;
      if(pPr){
        const st=pPr.getElementsByTagName('w:pStyle')[0];
        if(st){ const v=st.getAttribute('w:val')||''; const m=v.match(/Heading([1-6])/); if(m) level=parseInt(m[1]); else if(/Title/i.test(v)) level=1; }
        isList=!!pPr.getElementsByTagName('w:numPr')[0];
      }
      let html='';
      const runs=p.getElementsByTagName('w:r');
      for(const r of runs){
        const draw=r.getElementsByTagName('w:drawing')[0];
        if(draw){
          const blip=draw.getElementsByTagName('a:blip')[0]||draw.getElementsByTagName('blip')[0];
          if(blip){
            const rid=blip.getAttribute('r:embed');
            const du=rid? await imgFor(rid):null;
            if(du) html+='<img data-img="'+du+'" alt="" style="display:block;margin:1em auto;max-width:90%;height:auto;"/>';
          }
          continue;
        }
        const ts=r.getElementsByTagName('w:t');
        let t=''; for(const tt of ts) t+=tt.textContent;
        t=escapeXml(t);
        const rPr=r.getElementsByTagName('w:rPr')[0];
        if(rPr){
          const b=rPr.getElementsByTagName('w:b')[0]; const i=rPr.getElementsByTagName('w:i')[0];
          if(b && b.getAttribute('w:val')!=='0') t='<strong>'+t+'</strong>';
          else if(i && i.getAttribute('w:val')!=='0') t='<em>'+t+'</em>';
        }
        html+=t;
      }
      parsed.push({level,isList,html});
    }
    function buildBody(items){
      const out=[]; let listType=null, listBuf=[];
      const flush=()=>{ if(listBuf.length){ out.push('<ul>'+listBuf.join('')+'</ul>'); listBuf=[]; listType=null; } };
      items.forEach(item=>{
        if(item.level>=2){ flush(); out.push('<h'+item.level+'>'+item.html+'</h'+item.level+'>'); return; }
        if(item.isList){ listBuf.push('<li>'+item.html+'</li>'); listType='ul'; return; }
        flush();
        out.push('<p>'+(item.html||'<br/>')+'</p>');
      });
      flush();
      return out.join('');
    }
    const chapters=[];
    let cur=null;
    const pushCur=()=>{ if(cur && (cur.title||cur.body.length)) chapters.push({title:cur.title||'未命名章节', html:buildBody(cur.body)}); };
    for(const item of parsed){
      if(item.level===1){ pushCur(); cur={title:item.html||'未命名章节', body:[]}; }
      else { if(!cur) cur={title:'未命名章节', body:[]}; cur.body.push(item); }
    }
    pushCur();
    if(!chapters.length) chapters.push({title:'导入文档', html:'<p><br/></p>'});
    return {title:chapters[0].title, chapters, images};
  }catch(err){ throw err; }
}

async function importDocx(file){
  if(!confirm('导入 DOCX 将替换当前所有内容，确定继续？（草稿会先自动备份到浏览器本地）')) return;
  try{
    const buf=await file.arrayBuffer();
    const res=await docxToChapters(buf);
    const rawCount=(res.chapters||[]).length;
    const chapters=finalizeChapters(res.chapters||[]);
    currentId=null; // 导入前断开编辑器绑定，避免旧编辑器内容覆盖新章节
    book={ meta:{ title:res.title||'导入文档', author:'', language:'zh', date:'', cover:null, style:{lineHeight:1.8,align:'justify'} }, chapters, _images:res.images||{} };
    currentId=null;
    refreshCounts(); selectChapter(book.chapters[0].id); save();
    alert('已导入 '+book.chapters.length+' 个章节（按一级标题切分，二级/三级标题作为目录子标题'+(book.chapters.length>rawCount?'，过长章节已自动拆分':'')+'）。');
  }catch(err){
    alert('DOCX 导入失败：'+(err&&err.message?err.message:err));
  }
}

async function exportEpub(){
  if(!book.chapters.length){ alert('请先添加至少一个章节'); return; }
  commitEditor();
  refreshCounts();

  const {map,files}=collectImages();
  const sections=buildSections();
  const zip=new JSZip();
  zip.file('mimetype','application/epub+zip',{compression:'STORE'});
  zip.file('META-INF/container.xml',CONTAINER);
  const oebps=zip.folder('OEBPS');
  oebps.file('content.opf',buildOpf(sections,files));
  oebps.file('nav.xhtml',buildNav(sections));
  oebps.file('toc.ncx',buildNcx(sections));
  oebps.file('style.css',buildCss(book.meta.style));
  sections.forEach(s=>{ oebps.file(s.href, buildSectionXhtml(s,map)); });
  if(book.meta.cover){ oebps.file(book.meta.cover.name, book.meta.cover.data, {base64:true}); }
  if(files.length){
    const imgFolder=oebps.folder('images');
    files.forEach(f=> imgFolder.file(f.name, f.base64, {base64:true}));
  }

  const blob=await zip.generateAsync({type:'blob', mimeType:'application/epub+zip'});
  const fname=(book.meta.title||'book').replace(/[\\/:*?"<>|]/g,'_')+'.epub';
  download(blob,fname);
}

/* ---------- 左栏可拖动分隔线 ---------- */
(function setupVSplit(){
  const left=$('leftPanel'), vsplit=$('vsplit'), tree=$('treePane'), toc=$('tocPrev');
  if(!left||!vsplit||!tree||!toc) return;
  let dragging=false;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  vsplit.addEventListener('mousedown', e=>{
    dragging=true; e.preventDefault();
    document.body.style.cursor='row-resize'; document.body.style.userSelect='none';
  });
  window.addEventListener('mousemove', e=>{
    if(!dragging) return;
    const lr=left.getBoundingClientRect();
    const tr=tree.getBoundingClientRect();
    const tocR=toc.getBoundingClientRect();
    const topFixed=tr.top-lr.top;
    const bottomFixed=lr.bottom-tocR.bottom;
    const avail=lr.height-topFixed-bottomFixed;
    if(avail<=0) return;
    const h=clamp(e.clientY-lr.top-topFixed, 40, Math.max(40, avail-40));
    const ratio=h/avail;
    tree.style.flex=ratio+' 1 0';
    toc.style.flex=(1-ratio)+' 1 0';
  });
  window.addEventListener('mouseup', ()=>{
    if(dragging){ dragging=false; document.body.style.cursor=''; document.body.style.userSelect=''; }
  });
})();

/* ---------- 启动 ---------- */
(function init(){
  if(!load() || !book || !book.chapters){
    book={ meta:{title:'', author:'', language:'zh', date:'', cover:null, style:{lineHeight:1.8, align:'justify'}}, chapters:[] };
  }
  if(!book.chapters || !book.chapters.length){ book.chapters=[ newChapter('第 1 章') ]; }
  if(!book.meta) book.meta={};
  if(!book.meta.style) book.meta.style={lineHeight:1.8,align:'justify'};
  if(!book._images) book._images={};
  /* 修复历史草稿：早期版本中 docx/md 导入的章节没有 id，
     导致目录跳转把编辑区清空、折叠状态全篇串味。这里统一补上。 */
  let healed=0;
  const seen=new Set();
  book.chapters.forEach(c=>{
    if(!c.id || seen.has(c.id)){ c.id=uid(); healed++; }
    seen.add(c.id);
    /* 修复历史草稿里被二次转义的实体（粘贴/导入时 &nbsp; 被存成 &amp;nbsp;） */
    const before=c.html||'';
    const after=healEntities(before);
    if(after!==before){ c.html=after; healed++; }
  });
  /* √ 同上：即使 id 存在但重复，目录里的 data-goto 也会撞车（点甲章跳到乙章） */
  /* 单章过大（如整本书未分节）会在 contenteditable 里卡死，载入时提示可一键拆分 */
  const bigCh=book.chapters.find(c=>countWords(c.html)>HUGE_CHAPTER);
  currentId = book.chapters[0] ? book.chapters[0].id : null;
  refreshCounts();
  selectChapter(currentId);
  if(healed) save();
  if(bigCh){ setTimeout(()=>{ if(confirm('检测到「'+(bigCh.title||'未命名章节')+'」内容过大，编辑可能卡顿。\n是否现在按段落自动拆分为多章？')){ autoSplitCurrent(book.chapters.indexOf(bigCh)); } }, 300); }
})();
</script>
